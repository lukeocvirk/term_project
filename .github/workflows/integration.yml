name: Pydantic Family Integration Tests

on:
  schedule:
    - cron: '21 3 * * 1,2,3,4,5'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-pydantic-settings:
    name: Test pydantic settings
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: make test-pydantic-settings

  test-pydantic-extra-types:
    name: Test pydantic extra types
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: make test-pydantic-extra-types
